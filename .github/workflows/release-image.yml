name: Build and release image

# Builds the white-labelled IoT-Studio container image on every push to this
# branch, publishes it to GitHub Container Registry, and cuts a GitHub Release
# whenever the version in build.py is new.

on:
  push:
    branches: [whitelabel-iot-studio]
    paths-ignore:
      - "**.md"
      - "branding/make_og.py"
      - "branding/render.py"
  schedule:
    # Weekly rebuild to pick up upstream Velxio changes (Mondays 03:30 UTC).
    - cron: "30 3 * * 1"
  workflow_dispatch:

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # create tags / releases
  packages: write   # push to ghcr.io

env:
  IMAGE: ghcr.io/zhadowvalker/iot-studio
  # Fail the build if a branding patch stops matching upstream, rather than
  # shipping a half-branded image.
  IOT_STUDIO_STRICT: "1"
  # Public URL baked into canonical/OG tags. Set a repository variable
  # IOT_STUDIO_URL (Settings > Variables) to override.
  IOT_STUDIO_URL: ${{ vars.IOT_STUDIO_URL || 'http://localhost:3080' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        # The ESP-IDF toolchain stage is large; hosted runners are tight.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agent overlay unit tests
        run: |
          pip install -q pytest fastapi pydantic httpx
          cd overlay/backend && python -m pytest -q tests_agent

      - name: Prepare build context (clone Velxio, white-label, QEMU assets)
        run: python3 build.py prepare

      - name: Resolve version and upstream revision
        id: meta
        run: |
          version="$(python3 - <<'PY'
          import re
          m = re.search(r'^VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)', open("build.py").read(), re.M)
          print(m.group(1))
          PY
          )"
          upstream="$(git -C our-velxio/upstream rev-parse --short=12 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "IoT-Studio $version on Velxio $upstream"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.meta.outputs.version }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=IoT-Studio
            org.opencontainers.image.description=IoT-Studio - browser-based Arduino/ESP32/RP2040 simulator (built on Velxio, AGPLv3)
            org.opencontainers.image.licenses=AGPL-3.0-only
            io.iot-studio.version=${{ steps.meta.outputs.version }}
            io.iot-studio.velxio-revision=${{ steps.meta.outputs.upstream }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: our-velxio/upstream
          file: our-velxio/upstream/Dockerfile.oss
          platforms: linux/amd64   # the bundled QEMU libraries are x86-64 only
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VELXIO_LICENSE_KEY=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          UPSTREAM: ${{ steps.meta.outputs.upstream }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - image :latest and :sha-* refreshed only."
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "IoT-Studio ${VERSION}" \
            --generate-notes \
            --notes "Container image: \`${IMAGE}:${VERSION}\` (built on Velxio \`${UPSTREAM}\`).

          \`\`\`
          docker run -d --name iot-studio -p 3080:80 ${IMAGE}:${VERSION}
          \`\`\`
          Then open http://localhost:3080. Licensed AGPLv3; see NOTICE-IoT-Studio.md."
